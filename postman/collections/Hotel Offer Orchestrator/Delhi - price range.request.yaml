$kind: http-request
name: Delhi | price range
url: "{{baseUrl}}/api/hotels?city=delhi&minPrice=5000&maxPrice=6000"
method: GET
queryParams:
  city: delhi
  minPrice: "5000"
  maxPrice: "6000"
scripts:
  - type: afterResponse
    code: |-
      pm.test('HTTP 200', () => pm.response.to.have.status(200));
      pm.test('Two offers in the requested range', () => {
        const hotels = pm.response.json();
        pm.expect(hotels.map(hotel => hotel.name)).to.deep.equal(['Holtin', 'Radison']);
        pm.expect(hotels.map(hotel => hotel.price)).to.deep.equal([5340, 5900]);
      });
    language: text/javascript
order: 2000
