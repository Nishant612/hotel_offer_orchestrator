
services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    command:
      - redis-server
      - --appendonly
      - "yes"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  temporal:
    image: temporalio/temporal:latest
    restart: unless-stopped

    command:
      - server
      - start-dev
      - --ip
      - 0.0.0.0

    ports:
      - "7233:7233"
      - "8233:8233"

  api:
    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped

    command: npm run dev

    ports:
      - "3000:3000"

    environment:
      PORT: "3000"
      REDIS_URL: redis://redis:6379
      TEMPORAL_ADDRESS: temporal:7233
      SUPPLIER_BASE_URL: http://api:3000
      CACHE_TTL_SECONDS: "300"

    depends_on:
      redis:
        condition: service_healthy
      temporal:
        condition: service_started

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped

    command: npm run worker

    environment:
      REDIS_URL: redis://redis:6379
      TEMPORAL_ADDRESS: temporal:7233
      SUPPLIER_BASE_URL: http://api:3000
      CACHE_TTL_SECONDS: "300"

    depends_on:
      api:
        condition: service_healthy
      temporal:
        condition: service_started

volumes:
  redis_data:
